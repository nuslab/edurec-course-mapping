[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "edurec-course-mapping"
version = "0.1.0"
description = "Collect NUS EduRec course mapping requests and their linked documents into a pseudonymized store, track and validate proposals for them, and submit the proposals in a guided EduRec review"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Muhammad Rizki Aulia Rahman Maulana" }]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "Jinja2>=3.1,<4",
    "PyYAML>=6,<7",
    "playwright>=1.40,<2",
    "pydantic>=2.7,<3",
    "pypdfium2>=4.30,<6",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.10", "pytest>=8", "types-PyYAML", "pypdf>=4,<7"]

[project.scripts]
edurec-course-mapping = "edurec_course_mapping.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
edurec_course_mapping = ["py.typed", "terms.yaml", "page.js", "templates/*"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF", "PL", "C4", "ANN"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR0913", "PLR0915", "PLC1901"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pypdfium2"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
